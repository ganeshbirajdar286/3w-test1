services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: tmpn0txnedb-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    env_file:
      - path: backend/.env
        required: false
  client:
    build:
      context: client
      dockerfile: Dockerfile
    container_name: tmpn0txnedb-client
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - PORT=80
    env_file:
      - path: client/.env
        required: false
